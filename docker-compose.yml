version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerbridge-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: careerbridge-postgres
    environment:
      POSTGRES_DB: careerbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: careerbridge-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
